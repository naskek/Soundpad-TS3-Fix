name: Build Soundpad TS3 Fix

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch TeamSpeak 3 Plugin SDK
        shell: pwsh
        run: ./scripts/bootstrap.ps1

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package TeamSpeak plugin
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soundpad-ts3-fix-win64
          path: |
            dist/soundpad_ts3_fix.ts3_plugin
            build/Release/soundpad_ts3_diag_win64.dll
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "dist\soundpad_ts3_fix.ts3_plugin" `
            "build\Release\soundpad_ts3_diag_win64.dll" `
            --title "Soundpad TS3 Fix $env:GITHUB_REF_NAME" `
            --generate-notes
